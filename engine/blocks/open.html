<span class="copy__scrim" data-fade="-0.05,-0.01,0.22,0.40" aria-hidden="true"></span>
<div>
  <div data-fade="-0.05,-0.01,0.26,0.42">
    <figure class="invocation">
      <img src="assets/{{invocation.src}}" loading="eager" decoding="async" alt="{{invocation.alt}}"
           onerror="this.closest('.invocation').hidden=true">
    </figure>
    <p class="eyebrow">{{open.eyebrow}}</p>
    <p class="lede" style="margin-top:0">{{open.lede}}</p>
  </div>
  <div class="cue" data-fade="-0.05,-0.01,0.30,0.46">
    <span class="cue__gesture">
      <svg viewBox="0 0 20 34" aria-hidden="true" focusable="false">
        <path class="cue__track" d="M10 30V15"/>
        <path class="cue__chev" d="M5.4 10.6L10 6l4.6 4.6"/>
        <circle class="cue__dot" cx="10" cy="29" r="2.7"/>
      </svg>
    </span>
    {{open.cue}}
  </div>
</div>
<p class="hashtag open__tag" data-fade="0.62,0.74,1,1"><i>#</i>{{hashtag}}</p>
