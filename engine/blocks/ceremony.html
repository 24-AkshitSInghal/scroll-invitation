<div>
  <p class="eyebrow">{{event.name}}</p>
  <h2 class="display display--sm"><b>{{event.dateBig}}</b> {{event.dateRest}}</h2>
  <p class="meta"><strong>{{event.time}}</strong></p>
  <div class="countdown" aria-label="Time remaining"></div>
  <div class="btnrow">
    <a class="btn btn--ghost js-cal" href="#">Add to calendar</a>
  </div>
</div>
