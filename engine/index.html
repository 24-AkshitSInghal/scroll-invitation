<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{site.title}}</title>
<meta name="description" content="{{site.description}}">
<!-- Both schemes, so Safari's chrome tints to the invitation instead of
     falling back to dark grey on a phone in dark mode. -->
<meta name="theme-color" content="{{palette.--ivory}}" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="{{palette.--ivory}}" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="{{palette.--ivory}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light">

<meta property="og:type" content="website">
<meta property="og:title" content="{{site.title}}">
<meta property="og:description" content="{{site.description}}">
<meta property="og:image" content="{{site.ogImage}}">

<link rel="icon" href="assets/{{logo}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family={{fonts.google}}&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{fonts.google}}&display=swap"></noscript>
<link rel="stylesheet" href="css/base.css?v={{build}}">
<!-- After base.css, never before: the :root in base.css is only a fallback, and
     at equal specificity the later rule wins. Emitted first, every theme would
     quietly render in the default palette. -->
<style>{{themeVars}}</style>

<link rel="preload" as="image" href="assets/frames/c1/001.webp" fetchpriority="high">
</head>
<body>

<!-- The gate: the whole film loads behind this, then the visitor opens it. -->
<div class="curtain">
  <img class="curtain__mark" src="assets/{{logo}}" alt="{{couple.groom}} and {{couple.bride}} monogram">
  <div class="curtain__bar"><span class="curtain__fill"></span></div>
  <p class="curtain__pct">0%</p>
  <button class="curtain__open" type="button">Open Invitation</button>
</div>

<div class="amb" aria-hidden="true">
  <span class="amb__petal" style="left:8%;  animation-duration:26s; animation-delay:-3s"></span>
  <span class="amb__petal" style="left:17%; animation-duration:34s; animation-delay:-14s"></span>
  <span class="amb__petal" style="left:26%; animation-duration:29s; animation-delay:-21s"></span>
  <span class="amb__petal" style="left:76%; animation-duration:31s; animation-delay:-8s"></span>
  <span class="amb__petal" style="left:85%; animation-duration:24s; animation-delay:-17s"></span>
  <span class="amb__petal" style="left:93%; animation-duration:37s; animation-delay:-27s"></span>
</div>

<div class="stagewrap">
  <!-- The phone shell only exists on a wide screen; below 861px it is
       `display: contents` and the stage is the whole viewport again. -->
  <div class="device">
    <span class="device__btn device__btn--silent" aria-hidden="true"></span>
    <span class="device__btn device__btn--up" aria-hidden="true"></span>
    <span class="device__btn device__btn--down" aria-hidden="true"></span>
    <span class="device__btn device__btn--power" aria-hidden="true"></span>
    <div class="stage">

      <div class="copylayer">
{{sections}}
      </div><!-- /copylayer -->
      <span class="device__island" aria-hidden="true"></span>
    </div><!-- /stage -->
  </div><!-- /device -->
</div><!-- /stagewrap -->

<!-- Everything beside the phone. Desktop only. -->
<div class="room">
  <img class="room__watermark" src="assets/{{logo}}" alt="" aria-hidden="true">
  <div class="room__side room__side--left">
    <p class="room__eyebrow">{{room.eyebrow}}</p>
    <h1 class="room__names">{{couple.groom}}<span>&amp;</span>{{couple.bride}}</h1>
    <span class="room__rule" aria-hidden="true"></span>
    <p class="room__meta">
      <b>{{event.dateBig}} {{event.dateRest}}</b>
      {{room.meta}}
    </p>
  </div>
  <div class="room__side room__side--right">
    <p class="room__tag"><i>#</i>{{hashtag}}</p>
    <p class="room__now"><b class="room__count">01</b><span class="room__of">/ 10</span></p>
    <p class="room__scene">&nbsp;</p>
    <p class="room__hint">{{room.hint}}</p>
  </div>
</div>

<button class="music" type="button" aria-pressed="false" aria-label="Play music" title="{{music.title}}">
  <span class="music__ring" aria-hidden="true"></span>
  <svg class="music__on" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
    <path class="w1" d="M15.4 9.2a4 4 0 0 1 0 5.6"/>
    <path class="w2" d="M17.9 6.6a7.6 7.6 0 0 1 0 10.8"/>
  </svg>
  <svg class="music__off" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
    <path d="M16 9.6l5 4.8M21 9.6l-5 4.8"/>
  </svg>
</button>
<div class="progress" aria-hidden="true"><span class="progress__fill"></span></div>
<nav class="rail" aria-label="Jump to a moment"></nav>

<nav class="nav" aria-label="Move through the invitation">
  <button class="nav__btn nav__btn--prev" type="button" aria-label="Previous">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5.5L8.5 12l7 6.5"/></svg>
    <span>Back</span>
  </button>
  <span class="nav__count" aria-hidden="true"></span>
  <button class="nav__btn nav__btn--next" type="button" aria-label="Next">
    <span>Next</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5l7 6.5-7 6.5"/></svg>
  </button>
</nav>

<div class="track" aria-hidden="true"></div>

<script>window.INVITE = {{config}};</script>
<script src="js/film.js?v={{build}}"></script>
<script src="js/scroll-film.js?v={{build}}"></script>
<script src="js/interactions.js?v={{build}}"></script>
</body>
</html>
